name: tests
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m fundamental_engine analyze examples/emerging_demo.json --out runs/smoke
      - run: python -m fundamental_engine analyze examples/business_financing_demo.json --out runs/integration
      - run: python -m fundamental_engine analyze examples/real/meta_2022.json --out runs/real
      - run: python -m fundamental_engine analyze examples/real/boeing_2024.json --out runs/real
      - run: python -m fundamental_engine analyze examples/real/nike_2025.json --out runs/real
      - run: python -m fundamental_engine research-review examples/research_dossier_demo.json --out runs/research-review.json
      - run: python scripts/evaluate_brain.py
      - run: python -m pip wheel --no-deps --wheel-dir runs/wheels .
      - run: python scripts/check_wheel.py
