[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fundamental-engine"
version = "0.9.1"
description = "Evidence-first fundamental and emerging-potential research engine"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fundamental = "fundamental_engine.cli:main"

[tool.setuptools.packages.find]
include = ["fundamental_engine*"]

[tool.setuptools.package-data]
fundamental_engine = ["brain/*.json", "brain/protocols/*.md", "brain/playbooks/*.md"]
