[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fundamental-engine"
version = "0.2.0"
description = "Evidence-first fundamental and emerging-potential research engine"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fundamental = "fundamental_engine.cli:main"

[tool.setuptools.packages.find]
include = ["fundamental_engine*"]
